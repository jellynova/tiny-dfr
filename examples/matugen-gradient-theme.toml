# Matugen-Generated Gradient Theme for tiny-dfr
# This is an example of what the matugen template generates
# The actual colors will be dynamically generated based on your wallpaper
# 
# Changes apply immediately - no daemon restart required!

MediaLayerDefault = true
ShowButtonOutlines = true 
EnablePixelShift = false
FontTemplate = ":bold"
AdaptiveBrightness = true
ActiveBrightness = 128

# Button Configuration - MUST be at root level to avoid TOML nesting issues
PrimaryLayerKeys = [
    { Text = "F1",  Action = "F1"  },
    { Text = "F2",  Action = "F2"  },
    { Text = "F3",  Action = "F3"  },
    { Text = "F4",  Action = "F4"  },
    { Text = "F5",  Action = "F5"  },
    { Text = "F6",  Action = "F6"  },
    { Text = "F7",  Action = "F7"  },
    { Text = "F8",  Action = "F8"  },
    { Text = "F9",  Action = "F9"  },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12", Stretch = 2 }
]

# Media Layer Keys for media selector buttons
MediaLayerKeys = [
    { Icon = "brightness_low",  Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp"   },
    { Icon = "mic_off",         Action = "MicMute"        },
    { Icon = "search",          Action = "Search"         },
    { Icon = "backlight_low",   Action = "IllumDown"      },
    { Icon = "backlight_high",  Action = "IllumUp"        },
    { Icon = "fast_rewind",     Action = "PreviousSong"   },
    { Icon = "play_pause",      Action = "PlayPause"      },
    { Icon = "fast_forward",    Action = "NextSong"       },
    { Icon = "volume_off",      Action = "Mute"           },
    { Icon = "volume_down",     Action = "VolumeDown"     },
    { Icon = "volume_up",       Action = "VolumeUp"       }
]

# Color Configuration
[Colors]
# Default colors (will be overridden by individual buttons)
# Note: These will be dynamically generated by matugen based on your wallpaper
ButtonBackgroundInactive = [0.12, 0.12, 0.12]      # Surface color (dark)
ButtonBackgroundActive = [0.18, 0.18, 0.18]        # Surface dim when active
IconColor = [0.95, 0.95, 0.95]                     # On-surface color (light)
IconColorActive = [0.95, 0.95, 0.95]               # On-surface color when active
TextColor = [0.95, 0.95, 0.95]                     # On-surface color for text

# Individual gradient button backgrounds between primary and secondary colors
[Colors.ButtonOverrides]
# Media keys - use primary colors (bright, prominent)
"brightness_low" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"brightness_high" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"mic_off" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"search" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"backlight_low" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"backlight_high" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"fast_rewind" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"play_pause" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"fast_forward" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"volume_off" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"volume_down" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }
"volume_up" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }

# Function keys - gradient between primary and secondary colors
"F1" = { ButtonBackgroundInactive = [0.2, 0.6, 0.9], ButtonBackgroundActive = [0.3, 0.7, 1.0] }           # Primary blue
"F2" = { ButtonBackgroundInactive = [0.15, 0.45, 0.7], ButtonBackgroundActive = [0.25, 0.55, 0.8] }        # Primary container
"F3" = { ButtonBackgroundInactive = [0.8, 0.4, 0.2], ButtonBackgroundActive = [0.9, 0.5, 0.3] }           # Secondary orange
"F4" = { ButtonBackgroundInactive = [0.6, 0.3, 0.15], ButtonBackgroundActive = [0.7, 0.4, 0.25] }        # Secondary container
"F5" = { ButtonBackgroundInactive = [0.4, 0.8, 0.6], ButtonBackgroundActive = [0.5, 0.9, 0.7] }           # Tertiary green
"F6" = { ButtonBackgroundInactive = [0.3, 0.6, 0.45], ButtonBackgroundActive = [0.4, 0.7, 0.55] }        # Tertiary container
"F7" = { ButtonBackgroundInactive = [0.9, 0.3, 0.3], ButtonBackgroundActive = [1.0, 0.4, 0.4] }           # Error red
"F8" = { ButtonBackgroundInactive = [0.7, 0.2, 0.2], ButtonBackgroundActive = [0.8, 0.3, 0.3] }           # Error container
"F9" = { ButtonBackgroundInactive = [0.5, 0.5, 0.5], ButtonBackgroundActive = [0.6, 0.6, 0.6] }           # Outline gray
"F10" = { ButtonBackgroundInactive = [0.4, 0.4, 0.4], ButtonBackgroundActive = [0.5, 0.5, 0.5] }          # Outline variant
"F11" = { ButtonBackgroundInactive = [0.3, 0.3, 0.3], ButtonBackgroundActive = [0.4, 0.4, 0.4] }          # Shadow
"F12" = { ButtonBackgroundInactive = [0.2, 0.2, 0.2], ButtonBackgroundActive = [0.3, 0.3, 0.3] }          # Scrim
