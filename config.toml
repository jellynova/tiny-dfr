ButtonBackgroundActive = [0.757, 0.769, 0.922]
IconColor = [0.000, 0.212, 0.259]
IconColorActive = [0.165, 0.180, 0.302]
TextColor = [0.000, 0.212, 0.259]    

# Individual button overrides - all using accent color
[Colors.ButtonOverrides]
# Escape key
"esc" = { ButtonBackgroundInactive = [0.757, 0.769, 0.922], ButtonBackgroundActive = [0.525, 0.820, 0.914], IconColor = [0.000, 0.212, 0.259], IconColorActive = [0.165, 0.180, 0.302] }

